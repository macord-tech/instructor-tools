<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instructor Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Instructor">
<meta name="theme-color" content="#2E333B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Same instrument-panel look as Preflight Briefing and Client Records. */
  :root {
    --paper: #C8CDD2; --surface: #E3E6E9; --field: #D6DADE; --ink: #1D232A; --muted: #4F5964;
    --rule: #A9B0B8; --accent: #22568F; --accent-bg: #C9DDF1; --accent-ink: #FFFFFF;
    --warn: #A8321F; --warn-bg: #EBD6D1; --label: #B85A1C; --label-bg: #F1DDCB; --ok: #2F6B3A; --ok-bg: #D3E6D2;
    --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --f-body: 'Barlow', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --f-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #26292D; --surface: #31353A; --field: #282B2F; --ink: #EEF0F2; --muted: #B0B5BB;
      --rule: #4A4F55; --accent: #B79CF0; --accent-bg: #2D2640; --accent-ink: #1E2023;
      --warn: #FF8F7D; --warn-bg: #3A2D2A; --label: #F29A4B; --label-bg: #3A2F24; --ok: #8FD49A; --ok-bg: #263A2A; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #26292D; --surface: #31353A; --field: #282B2F; --ink: #EEF0F2; --muted: #B0B5BB;
    --rule: #4A4F55; --accent: #B79CF0; --accent-bg: #2D2640; --accent-ink: #1E2023;
    --warn: #FF8F7D; --warn-bg: #3A2D2A; --label: #F29A4B; --label-bg: #3A2F24; --ok: #8FD49A; --ok-bg: #263A2A; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
    padding-block: max(18px, env(safe-area-inset-top, 0px)) 44px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .wrap > *, .panel > *, .list > *, .exrow > * { min-width: 0; }
  @media (max-width: 480px) { .marks button { width: 40px; height: 40px; font-size: 16px; } .exhead { grid-template-columns: 40px minmax(0, 1fr); } .exhead .marks { grid-column: 1 / -1; } .seg.tabs button { font-size: 14px; padding: 0 4px; } }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .hdr-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .eyebrow { font-family: var(--f-display); font-weight: 500; font-size: 15px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent); }
  h1 { font-family: var(--f-display); font-weight: 600; margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.02; }
  h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: .06em; }
  h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .btn {
    font: inherit; font-size: 15px; font-weight: 600; padding: 0 16px; border: 1px solid var(--accent); border-radius: 4px;
    background: transparent; color: var(--accent); cursor: pointer; min-height: 44px; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn.danger { border-color: var(--warn); color: var(--warn); }
  .btn[data-armed] { background: var(--warn); color: #fff; border-color: var(--warn); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--field); }
  .seg button { flex: 1; min-height: 46px; padding: 0 10px; border: 0; background: transparent; color: var(--ink); font-family: var(--f-body); font-weight: 600; font-size: 16px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg.sm button { min-height: 38px; font-size: 14px; padding: 0 8px; }
  .tabs { max-width: 760px; }
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-family: var(--f-display); font-weight: 500; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-bg); padding: 3px 9px; border-radius: 3px; white-space: nowrap; }
  .tag.warn { color: var(--warn); background: var(--warn-bg); }
  .tag.ok { color: var(--ok); background: var(--ok-bg); }
  .tag.plain { color: var(--muted); background: var(--field); }
  .tag.lab { color: var(--label); background: var(--label-bg); }
  .field { display: grid; gap: 6px; margin-bottom: 12px; min-width: 0; }
  .lbl { font-family: var(--f-display); font-weight: 500; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .in { width: 100%; min-width: 0; min-height: 44px; border: 1px solid var(--rule); border-radius: 4px; background: var(--field); color: var(--ink); padding: 0 12px; font-family: var(--f-body); font-size: 16px; }
  textarea.in { padding: 10px 12px; min-height: 80px; resize: vertical; line-height: 1.4; }
  .in.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
  .row2, .row3, .row4 { display: grid; gap: 0 12px; }
  .row2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 640px) { .row3, .row4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .row2, .row3, .row4 { grid-template-columns: minmax(0, 1fr); } }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 14px; color: var(--muted); margin: 4px 0 10px; }
  .empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); border-radius: 5px; }
  .msg { min-height: 1.4em; font-size: 14px; color: var(--accent); }
  .msg.err { color: var(--warn); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .checks label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--field); font-size: 15px; cursor: pointer; min-height: 40px; }
  .checks input { width: 18px; height: 18px; accent-color: var(--accent); }
  details.sec { border: 1px solid var(--rule); border-radius: 6px; background: var(--field); margin-bottom: 12px; }
  details.sec > summary { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; cursor: pointer; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 16px; list-style: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '▸'; color: var(--accent); }
  details.sec[open] > summary::before { content: '▾'; }
  details.sec > summary .sp { flex: 1; }
  details.sec > .body { padding: 4px 14px 12px; }
  details.sec .in { background: var(--surface); }

  /* Today */
  .datebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .datebar .in { width: auto; font-family: var(--f-data); }
  .daylabel { font-family: var(--f-display); font-size: 20px; font-weight: 600; letter-spacing: .04em; }
  .sgroup { border: 1px solid var(--rule); border-radius: 6px; background: var(--field); padding: 12px; display: grid; gap: 8px; }
  .sgroup .shead { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sgroup .sname { font-weight: 700; font-size: 18px; cursor: pointer; background: none; border: 0; color: var(--ink); padding: 0; font-family: inherit; text-align: left; }
  .icard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 5px; background: var(--surface); padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); width: 100%; }
  .icard.done { border-left-color: var(--ok); }
  .icard .tm { font-family: var(--f-data); font-weight: 600; min-width: 52px; }
  .icard .tt { font-weight: 700; }
  .icard .sub { font-size: 14px; color: var(--muted); }
  .icard .st { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .dot { font-size: 12px; font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--paper); color: var(--muted); white-space: nowrap; }
  .dot.y { background: var(--ok-bg); color: var(--ok); }
  .grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .list { display: grid; gap: 6px; }
  .citem { text-align: left; width: 100%; border: 1px solid var(--rule); border-radius: 5px; background: var(--field); color: var(--ink); padding: 10px 12px; cursor: pointer; font: inherit; display: grid; gap: 2px; }
  .citem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); background: var(--surface); }
  .citem .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .citem .sub { font-size: 14px; color: var(--muted); }
  .rem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-left: 4px solid var(--warn); border-radius: 5px; background: var(--field); }
  .rem .when { font-size: 13px; color: var(--muted); font-family: var(--f-data); }

  /* Flight test */
  .ftsum { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); box-shadow: 0 6px 14px -12px rgba(0,0,0,.6); }
  .ftsum .big { font-family: var(--f-data); font-weight: 700; font-size: 22px; }
  .ftsum .k { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .exrow { border: 1px solid var(--rule); border-radius: 6px; background: var(--field); padding: 10px 12px; display: grid; gap: 8px; }
  .exrow.m1 { border-left: 4px solid var(--warn); }
  .exrow.m2 { border-left: 4px solid var(--label); }
  .exrow.m3 { border-left: 4px solid var(--accent); }
  .exrow.m4 { border-left: 4px solid var(--ok); }
  .exhead { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .exid { font-family: var(--f-data); font-weight: 700; font-size: 17px; }
  .extitle { font-weight: 700; }
  .marks { display: flex; gap: 6px; }
  .marks button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--rule); background: var(--surface); color: var(--ink); font-family: var(--f-data); font-weight: 700; font-size: 18px; cursor: pointer; }
  .exrow { gap: 0; padding: 6px 10px; }
  .exrow.open { gap: 8px; padding: 10px 12px; }
  .exbody { display: grid; gap: 8px; margin-top: 8px; }
  .exbtn { background: none; border: 0; padding: 6px 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-height: 44px; }
  .exbtn .chev { color: var(--accent); margin-left: 4px; }
  .pill.tol { border-style: dashed; font-family: var(--f-body); font-weight: 600; }
  .marks button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .marks button[aria-pressed="true"][data-v="1"] { background: var(--warn); border-color: var(--warn); color: #fff; }
  .marks button[aria-pressed="true"][data-v="2"] { background: var(--label); border-color: var(--label); color: #fff; }
  .marks button[aria-pressed="true"][data-v="4"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font: inherit; font-size: 14px; line-height: 1.25; text-align: left; padding: 7px 12px; border-radius: 16px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; max-width: 100%; }
  .pill b { font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
  .pill.s3 { background: var(--accent-bg); border-color: var(--accent); color: var(--ink); }
  .pill.s3 b { color: var(--accent); }
  .pill.s2 { background: var(--label-bg); border-color: var(--label); }
  .pill.s2 b { color: var(--label); }
  .pill.s1 { background: var(--warn-bg); border-color: var(--warn); }
  .pill.s1 b { color: var(--warn); }
  .exmore { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .exmore .in { min-height: 38px; }
  details.fm summary { cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .tk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); overflow: hidden; }
  .tk h4 { grid-column: 1 / -1; margin: 0; padding: 6px 12px; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; }
  .tk h4.sub { background: var(--paper); color: var(--ink); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .tk .kv { display: grid; gap: 4px; padding: 8px 10px; border-right: 1px solid var(--rule); min-width: 0; }
  .tk .kv label { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tk .pair { display: flex; gap: 6px; }
  .tk .in { background: var(--surface); font-family: var(--f-data); min-height: 42px; }
  .tk .res { display: grid; align-content: center; gap: 2px; padding: 8px 12px; font-family: var(--f-data); font-size: 14px; white-space: nowrap; }
  .tk .res b { font-size: 17px; }
  @media (max-width: 760px) { .tk { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tk .kv:nth-of-type(2n) { border-right: 0; } .tk .kv { border-bottom: 1px solid var(--rule); } .tk .res { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 18px; white-space: normal; } }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
  .scale { display: grid; gap: 8px; }
  .scale div { padding: 8px 10px; border-radius: 5px; background: var(--field); border: 1px solid var(--rule); font-size: 14px; }

  .modal { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); display: flex; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 10px 24px; overflow: auto; z-index: 20; }
  .modal[hidden] { display: none; }
  .modal-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; width: min(820px, 100%); padding: 16px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .x { width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 4px; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; flex: none; }
  .syncdot { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); display: inline-block; }
  .syncdot.ok { background: var(--ok); } .syncdot.busy { background: var(--label); } .syncdot.err { background: var(--warn); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px; font-weight: 600; z-index: 40; max-width: 90vw; }
  .toast[hidden] { display: none; }
  #print { display: none; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .wrap, .modal, .toast { display: none !important; }
    #print { display: block; font-family: Arial, sans-serif; font-size: 11pt; color: #000; }
    #print h1 { font-size: 18pt; margin: 0 0 4pt; }
    #print h2 { font-size: 13pt; margin: 12pt 0 4pt; letter-spacing: 0; }
    #print table { width: 100%; border-collapse: collapse; margin-top: 6pt; }
    #print th, #print td { border: 1px solid #555; padding: 3pt 5pt; vertical-align: top; text-align: left; font-size: 10pt; }
    #print .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2pt 16pt; font-size: 10.5pt; }
    #print .blk { break-inside: avoid; border: 1px solid #777; padding: 6pt 8pt; margin-top: 8pt; }
    #print .sm { font-size: 9pt; color: #333; }
    #print .c { text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Flight Instructor Tools</div>
      <h1>Instructor Hub</h1>
    </div>
    <div class="hdr-right">
      <button class="btn small" type="button" data-act="syncNow" title="Sync"><span class="syncdot" id="syncDot"></span> <span id="syncTxt">Sync</span></button>
      <button class="btn small" type="button" id="themeBtn">Dark</button>
    </div>
  </header>
  <div class="seg tabs" role="group" aria-label="Sections">
    <button type="button" data-act="tab" data-v="today">Today</button>
    <button type="button" data-act="tab" data-v="students">Students</button>
    <button type="button" data-act="tab" data-v="tests">MOCK FLT Test</button>
    <button type="button" data-act="tab" data-v="settings">Settings</button>
  </div>
  <main id="view"></main>
</div>
<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head"><h2 id="modalTitle"></h2><button class="x" type="button" data-act="closeModal" aria-label="Close">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div class="toast" id="toast" hidden></div>
<div id="print"></div>

<script src="ftg-data.js"></script>
<script>
'use strict';
// ======================= helpers =======================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDay(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDay(d); };
const fmtDay = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
let toastT = 0;
const toast = t => { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); };
const val = id => { const e = $(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; };

// ======================= constants =======================
const KINDS = ['Flight', 'Solo', 'Ground', 'Sim', 'Check ride', 'Flight test', 'Other'];
const PROGRAMS = ['PPL', 'CPL', 'RPP', 'Instrument', 'Multi-engine', 'Instructor rating', 'Other'];
const TESTS = {
  rpp: { name: 'Recreational Pilot Permit', short: 'RPP', form: '26-0495E', pass: 42, guide: 'TP 12475E (03/2021)' },
  ppl: { name: 'Private Pilot Licence', short: 'PPL', form: '26-0064E', pass: 62, guide: 'TP 13723E (03/2021)' },
  cpl: { name: 'Commercial Pilot Licence', short: 'CPL', form: '26-0657E', pass: 93, passInt: 81, guide: 'TP 13462E (01/2021)' }
};
// Emergency checklist headings, from the school's emergency checklists for each aircraft.
const EMERG = {

// ======================= data store (synced) =======================
const DATA_KEY = 'ihData';
const COLS = ['students', 'items', 'rems', 'tests'];
let D = { students: {}, items: {}, rems: {}, tests: {}, deleted: {} };
try { const d = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); if (d) D = Object.assign(D, d); } catch (e) {}
COLS.concat('deleted').forEach(k => D[k] = D[k] || {});
const persist = () => { try { localStorage.setItem(DATA_KEY, JSON.stringify(D)); } catch (e) { toast('Could not save on this device (storage full?)'); } };
const put = (col, rec) => { rec.u = Date.now(); D[col][rec.id] = rec; persist(); queueSync(); return rec; };
const del = (col, id) => { delete D[col][id]; D.deleted[id] = Date.now(); persist(); queueSync(); };

// Merge two datasets record by record: newest edit wins, deletions win over older edits.
function merge(a, b) {
  const out = { students: {}, items: {}, rems: {}, tests: {}, deleted: Object.assign({}, a.deleted || {}) };
  Object.entries(b.deleted || {}).forEach(([id, t]) => { out.deleted[id] = Math.max(out.deleted[id] || 0, t); });
  COLS.forEach(c => {
    const ids = new Set(Object.keys(a[c] || {}).concat(Object.keys(b[c] || {})));
    ids.forEach(id => {
      const x = (a[c] || {})[id], y = (b[c] || {})[id];
      const r = !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x);
      if (out.deleted[id] && out.deleted[id] >= (r.u || 0)) return;
      out[c][id] = r;
    });
  });
  // keep tombstones for 120 days
  const cut = Date.now() - 120 * 864e5;
  Object.keys(out.deleted).forEach(id => { if (out.deleted[id] < cut) delete out.deleted[id]; });
  return out;
}

// ======================= GitHub Gist sync =======================
const GIST_FILE = 'instructor-hub.json', GIST_DESC = 'Instructor Hub data (private)';
let syncing = false, syncAgain = false, syncTimer = 0;
const setSyncUI = (state, txt) => { $('syncDot').className = 'syncdot ' + (state || ''); $('syncTxt').textContent = txt || 'Sync'; };
function queueSync() { if (!SET.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), 2500); }
async function gh(method, path, body) {
  const r = await fetch('https://api.github.com' + path, { method, cache: 'no-store', headers: { Authorization: 'Bearer ' + SET.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(r.status + ' ' + (r.status === 401 ? 'token not accepted' : r.status === 404 ? 'gist not found' : t.slice(0, 120))); }
  return r.json();
}
async function findGist() {
  for (let page = 1; page <= 5; page++) {
    const list = await gh('GET', '/gists?per_page=100&page=' + page);
    const g = list.find(x => x.files && x.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }
  return '';
}
async function sync(manual) {
  if (!SET.token) { if (manual) { UI.tab = 'settings'; render(); toast('Add a GitHub token in Settings to sync'); } return; }
  if (!navigator.onLine) { setSyncUI('err', 'Offline'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSyncUI('busy', 'Syncing…');
  try {
    if (!SET.gistId) { SET.gistId = await findGist(); saveSet(); }
    let remote = null;
    if (SET.gistId) {
      const g = await gh('GET', '/gists/' + SET.gistId);
      const f = g.files && g.files[GIST_FILE];
      if (f) remote = JSON.parse(f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content);
    }
    const before = JSON.stringify(D);
    if (remote) D = merge(D, remote);
    const content = JSON.stringify(D);
    if (!SET.gistId) {
      const g = await gh('POST', '/gists', { description: GIST_DESC, public: false, files: { [GIST_FILE]: { content } } });
      SET.gistId = g.id;
    } else if (!remote || content !== JSON.stringify(remote)) {
      await gh('PATCH', '/gists/' + SET.gistId, { files: { [GIST_FILE]: { content } } });
    }
    persist();
    SET.lastSync = Date.now(); saveSet();
    setSyncUI('ok', 'Synced ' + nowHM());
    if (content !== before) { const ae = document.activeElement; if ($('modal').hidden && !(ae && $('view').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }
    if (manual) toast('Synced');
  } catch (e) {
    setSyncUI('err', 'Sync failed');
    if (manual || UI.tab === 'settings') toast('Sync failed: ' + e.message);
    console.warn(e);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; queueSync(); }
  }
}
window.addEventListener('online', () => queueSync());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });

// ======================= FLIGHT TESTS =======================
function testDef(t) { return FTG[t.kind] || []; }
function exVariant(t, ex) { const m = (t.marks || {})[ex.id] || {}; return ex.v[Math.min(m.v || 0, ex.v.length - 1)] || ex.v[0]; }
function exState(t, ex) { return (t.marks || {})[ex.id] || {}; }
function testResult(t) {
  const exs = testDef(t), T = TESTS[t.kind];
  let total = 0, marked = 0;
  const failG = [], failA = [];
  exs.forEach(ex => {
    const m = exState(t, ex).m;
    if (m) { total += m; marked++; if (m === 1) (ex.ground ? failG : failA).push(ex.id); }
  });
  const max = exs.length * 4, need = t.kind === 'cpl' && t.integrated ? T.passInt : T.pass;
  const complete = marked === exs.length;
  let status = 'In progress', cls = 'plain', detail = '';
  if (failG.length) { status = 'Fail'; cls = 'warn'; detail = 'Ground item failed (' + failG.join(', ') + '): complete re-test required.'; }
  else if (failA.length >= 3) { status = 'Fail'; cls = 'warn'; detail = failA.length + ' air items failed (' + failA.join(', ') + '): complete re-test required.'; }
  else if (failA.length) { status = 'Fail'; cls = 'warn'; detail = 'Air item' + (failA.length > 1 ? 's' : '') + ' failed (' + failA.join(', ') + '): partial flight test required' + (complete && !t.partial && total < need ? '' : '') + '.'; }
  if (complete && !t.partial && total < need) { status = 'Fail'; cls = 'warn'; detail = (detail ? detail + ' ' : '') + 'Total ' + total + ' is below the pass mark of ' + need + ': complete re-test required.'; }
  if (complete && status === 'In progress') { status = 'Pass'; cls = 'ok'; detail = t.partial ? 'All re-tested items passed.' : 'Total ' + total + ' meets the pass mark of ' + need + '.'; }
  if (!complete && status === 'In progress') detail = (exs.length - marked) + ' of ' + exs.length + ' items still to mark.';
  return { total, marked, max, need, status, cls, detail, failG, failA, count: exs.length };
}
function testCardHTML(t) {

    <span class="sub">${esc(t.date || '')} · ${esc(t.mode || 'Mock')} · ${r.total} / ${r.marked * 4} marked${t.aircraft ? ' · ' + esc(t.aircraft) : ''}</span></button>`;

const hm2min = v => { const m = String(v || '').replace(/[^0-9]/g, ''); if (m.length < 3) return NaN; const h = +m.slice(0, -2), mi = +m.slice(-2); return h < 24 && mi < 60 ? h * 60 + mi : NaN; };

function tkCalc(tk) {

function sumHTML(t, r) {
  return `<div><div class="k">Total</div><div class="big">${r.total}<span style="font-size:15px;color:var(--muted)"> / ${r.max}</span></div></div>
    <div><div class="k">Pass mark</div><div class="big">${t.partial ? '—' : r.need}</div></div>

}
function refreshEx(t, exId) {
  const ex = testDef(t).find(e => e.id === exId), el = $('ex_' + exId.replace('.', '_'));
  if (ex && el) { const open = el.querySelector('details.fm') && el.querySelector('details.fm').open; el.outerHTML = exRowHTML(t, ex); const nf = $('ex_' + exId.replace('.', '_')).querySelector('details.fm'); if (open && nf) nf.open = true; }
  $('ftsum').innerHTML = sumHTML(t, testResult(t));
}
function devLines(t, ex) {
  const m = exState(t, ex), v = exVariant(t, ex), out = [];
  Object.entries(m.p || {}).forEach(([i, s]) => { if (s && v.pills[i]) out.push({ s, t: v.pills[i].t, f: v.pills[i].f }); });
  Object.entries(m.fm || {}).forEach(([i, s]) => { if (s && FM[i]) out.push({ s, t: FM[i], f: FM[i] }); });
  return out.sort((a, b) => a.s - b.s);
}
function testText(t) {
  const T = TESTS[t.kind], r = testResult(t);
  const L = [`${T.name} flight test${t.partial ? ' (partial)' : ''} — ${sName(t.sid)}`, `${fmtDay(t.date)} · ${t.mode || ''}${t.aircraft ? ' · ' + t.aircraft : ''}`, `Result: ${r.status}. ${r.detail}`, `Total ${r.total} / ${r.max}${t.partial ? '' : ' (pass mark ' + r.need + ')'}`];
  const tk = t.tk || {}, tc = tkCalc(tk);
  if (tk.hs || tk.he || tk.up || tk.down) L.push(`HOBBS ${tk.hs || '—'}–${tk.he || '—'} (${tc.flt}) · Time up ${tk.up || '—'} · Time down ${tk.down || '—'} · Air time ${tc.air}`);
  if (tk.bs || tk.be) L.push(`Ground brief ${tk.bs || '—'}–${tk.be || '—'} · Brief time ${tc.brief}${tk.bn ? ' · ' + tk.bn : ''}`);
  L.push('');
  testDef(t).forEach(ex => {
    const m = exState(t, ex), d = devLines(t, ex), v = exVariant(t, ex);
    if (!m.m && !d.length && !m.r) return;
    L.push(`${ex.id} ${ex.title}${ex.v.length > 1 ? ' (' + (/soft/i.test(v.label) ? 'soft' : 'short') + ')' : ''}${m.ch ? ' — ' + m.ch : ''}: ${m.m || '–'}`);
    d.forEach(x => L.push(`   • ${SEV[x.s]}: ${x.t}`));
    if (m.r) L.push('   ' + m.r);
  });
  if (t.notes) L.push('', t.notes);
  if (SET.instructor) L.push('', '— ' + SET.instructor);
  return L.join('\n');
}

    <div class="sm">${t.mode && /mock/i.test(t.mode) ? 'Mock / pre-test assessment — not a Transport Canada form. ' : ''}Marked against TC form ${esc(T.form)} and Flight Test Guide ${esc(T.guide)}.</div>
    <div class="meta" style="margin-top:6pt"><div><b>Applicant:</b> ${esc(sName(t.sid))}</div><div><b>Date:</b> ${esc(fmtDay(t.date))}</div><div><b>Assessor:</b> ${esc(t.examiner || '')}</div><div><b>Location:</b> ${esc(t.loc || '')}</div>

    <table><tr><th style="width:9%">Ex.</th><th style="width:30%">Exercise</th><th class="c" style="width:7%">Mark</th><th>Remarks / deviations from the Performance Criteria</th></tr>
    ${testDef(t).map(ex => { const m = exState(t, ex), d = devLines(t, ex), v = exVariant(t, ex);
      return `<tr><td>${esc(ex.id)}</td><td>${esc(ex.title)}${ex.v.length > 1 ? ' — ' + (/soft/i.test(v.label) ? 'soft field' : 'short field') : ''}${m.ch ? '<br><span class="sm">' + esc(m.ch) + '</span>' : ''}</td><td class="c"><b>${m.m || ''}</b></td>
      <td>${d.map(x => `<div><b>${SEV[x.s]}:</b> ${esc(x.t)}</div>`).join('')}${m.r ? `<div><i>${esc(m.r)}</i></div>` : ''}</td></tr>`; }).join('')}
    </table>
    <div class="blk"><b>Final assessment:</b> ${esc(r.status)} — total ${r.total} / ${r.max}${t.partial ? '' : ', mark required ' + r.need}. ${esc(r.detail)}</div>
    ${t.notes ? `<div class="blk" style="white-space:pre-wrap"><b>General remarks:</b><br>${esc(t.notes)}</div>` : ''}`);
}

// ======================= modal =======================
function openModal(title, html) { $('modalTitle').textContent = title; $('modalBody').innerHTML = html; $('modal').hidden = false; $('modal').scrollTop = 0; }
function closeModal() { $('modal').hidden = true; $('modalBody').innerHTML = ''; }

// ======================= events =======================
function armed(btn) {
  if (!btn.dataset.confirm) return true;
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = btn.dataset.confirm;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
function cycle(obj, i) { const s = obj[i] || 0; const n = s === 0 ? 3 : s === 3 ? 2 : s === 2 ? 1 : 0; if (n) obj[i] = n; else delete obj[i]; }
function curTest() { return D.tests[UI.testId]; }
function saveTest(t) { put('tests', t); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (!armed(b)) return;
  const id = b.dataset.id;
  switch (a) {
    case 'tab': UI.tab = b.dataset.v; if (UI.tab === 'tests') UI.testId = null; render(); window.scrollTo(0, 0); break;
    case 'closeModal': closeModal(); break;
    case 'day': UI.day = b.dataset.v === '0' ? today() : addDays(UI.day, +b.dataset.v); render(); break;
    case 'newItem': {
      if (!activeStudents().length) { openModal('New student', studentForm({ program: 'PPL' })); break; }
      openItem({ sid: b.dataset.sid || (UI.tab === 'students' && UI.sid) || activeStudents()[0].id, date: UI.tab === 'today' ? UI.day : today(), kind: 'Flight', aircraft: '' }); break;
    }
    case 'editItem': openItem(D.items[id]); break;
    case 'now': $(b.dataset.v).value = nowHM(); break;
    case 'dupItem': { const r = readItemForm(); openItem(Object.assign({}, r, { id: '', date: today(), done: false, pre: {}, deb: {}, pf: { ap: r.pf.ap } })); break; }
    case 'delItem': { const fid = $('itemForm').dataset.id; del('items', fid); closeModal(); render(); toast('Item deleted'); break; }
    case 'printItem': printItem(readItemForm()); break;
    case 'mailItem': { const r = readItemForm(), s = student(r.sid) || {}; location.href = 'mailto:' + encodeURIComponent(s.email || '') + '?subject=' + encodeURIComponent('Debrief: ' + (r.title || r.kind) + ' ' + r.date) + '&body=' + encodeURIComponent(itemText(r)); break; }
    case 'scheduleNext': {
      const r = readItemForm(); const d = val('db_nextDate');
      if (!d) { toast('Pick a date for the next lesson'); break; }
      if (!saveItem(r)) break;
      put('items', { id: uid(), sid: r.sid, date: d, time: '', kind: r.kind === 'Ground' ? 'Ground' : 'Flight', aircraft: r.aircraft, title: (r.deb.next || '').split('\n')[0].slice(0, 80) || 'Next lesson', done: false, pf: { ap: r.pf.ap }, pre: { obj: r.deb.next || '' }, deb: {} });
      closeModal(); render(); toast('Saved, and next lesson added for ' + fmtDay(d)); break;
    }
    case 'printDay': printDay(); break;
    case 'newStudent': openModal('New student', studentForm({ program: 'PPL' })); break;
    case 'editStudent': openModal('Edit student', studentForm(D.students[id])); break;
    case 'delStudent': {
      const sid = $('studentForm').dataset.id;
      arr('items').filter(i => i.sid === sid).forEach(i => del('items', i.id));
      arr('rems').filter(i => i.sid === sid).forEach(i => del('rems', i.id));
      arr('tests').filter(i => i.sid === sid).forEach(i => del('tests', i.id));
      del('students', sid); UI.sid = null; closeModal(); render(); break;
    }
    case 'openStudent': UI.sid = id; UI.tab = 'students'; render(); if (innerWidth < 860) setTimeout(() => document.querySelectorAll('.panel')[1].scrollIntoView({ behavior: 'smooth' }), 30); break;
    case 'addRem': { const t = val('newRem').trim(); if (!t) break; put('rems', { id: uid(), sid: id, text: t, src: 'Added manually', opened: today(), by: SET.instructor, resolved: false }); render(); break; }
    case 'resolveRem': { const r = D.rems[id]; put('rems', Object.assign({}, r, { resolved: true, resolvedAt: today(), resolvedBy: SET.instructor })); render(); toast('Resolved'); break; }
    case 'reopenRem': { const r = D.rems[id]; put('rems', Object.assign({}, r, { resolved: false, resolvedAt: '', resolvedBy: '' })); render(); break; }
    case 'newTest': {
      if (!activeStudents().length) { toast('Add a student first'); break; }
      const s = student(b.dataset.sid || UI.sid) || activeStudents()[0];
      openModal('New marking sheet', testSetupForm({ sid: s.id, kind: s.program === 'CPL' ? 'cpl' : s.program === 'RPP' ? 'rpp' : 'ppl', date: today(), mode: 'Mock / pre-test' })); break;
    }
    case 'openTest': UI.openEx.clear(); UI.testId = id; UI.tab = 'tests'; render(); window.scrollTo(0, 0); break;
    case 'backTests': UI.testId = null; UI.openEx.clear(); render(); break;
    case 'tkNow': { const t = curTest(); t.tk = t.tk || {}; t.tk[b.dataset.v] = nowHM(); saveTest(t); $('tk_' + b.dataset.v).value = t.tk[b.dataset.v]; const c = tkCalc(t.tk); $('tkRes').innerHTML = tkResHTML(c); $('tkBrief').innerHTML = `<span>Brief time <b>${esc(c.brief)}</b></span>`; break; }
    case 'toggleEx': { const x = b.dataset.ex; if (UI.openEx.has(x)) UI.openEx.delete(x); else UI.openEx.add(x); refreshEx(curTest(), x); break; }
    case 'expandAll': testDef(curTest()).forEach(ex => UI.openEx.add(ex.id)); render(); break;
    case 'collapseAll': UI.openEx.clear(); render(); break;
    case 'editTest': openModal('Sheet details', testSetupForm(curTest())); break;
    case 'delTest': { del('tests', $('testForm').dataset.id); UI.testId = null; closeModal(); render(); break; }
    case 'mark': { const t = curTest(); t.marks = t.marks || {}; const m = t.marks[b.dataset.ex] = t.marks[b.dataset.ex] || {}; const v = +b.dataset.v; m.m = m.m === v ? 0 : v; saveTest(t); refreshEx(t, b.dataset.ex); break; }
    case 'pill': case 'fm': {
      const t = curTest(); t.marks = t.marks || {}; const m = t.marks[b.dataset.ex] = t.marks[b.dataset.ex] || {};
      const k = a === 'pill' ? 'p' : 'fm'; m[k] = m[k] || {}; cycle(m[k], b.dataset.i);
      saveTest(t); refreshEx(t, b.dataset.ex); break;
    }
    case 'variant': { const t = curTest(); t.marks = t.marks || {}; const m = t.marks[b.dataset.ex] = t.marks[b.dataset.ex] || {}; if ((m.v || 0) !== +b.dataset.v) { m.v = +b.dataset.v; m.p = {}; } saveTest(t); refreshEx(t, b.dataset.ex); break; }
    case 'printTest': printTest(curTest()); break;
    case 'mailTest': { const t = curTest(), s = student(t.sid) || {}; location.href = 'mailto:' + encodeURIComponent(s.email || '') + '?subject=' + encodeURIComponent(TESTS[t.kind].short + ' flight test ' + (t.mode || '') + ' ' + t.date) + '&body=' + encodeURIComponent(testText(t)); break; }
    case 'toRem': {
      const t = curTest(); let n = 0;
      const existing = new Set(arr('rems').filter(r => r.sid === t.sid && !r.resolved).map(r => r.text));
      testDef(t).forEach(ex => devLines(t, ex).filter(x => x.s <= 2).forEach(x => {
        const text = `${ex.id} ${ex.title}: ${x.t}`;
        if (existing.has(text)) return; existing.add(text);
        put('rems', { id: uid(), sid: t.sid, text, src: TESTS[t.kind].short + ' ' + (t.mode || '') + ' ' + t.date + ' (' + SEV[x.s].toLowerCase() + ')', opened: today(), by: SET.instructor, resolved: false }); n++;
      }));
      toast(n ? n + ' major/critical deviation' + (n === 1 ? '' : 's') + ' added to ' + sName(t.sid) + '’s remediation list' : 'No new major or critical deviations to add'); break;
    }
    case 'saveToken': SET.token = val('st_tok').trim(); saveSet(); if (SET.token) sync(true).then(render); else render(); break;
    case 'forgetToken': SET.token = ''; SET.gistId = ''; saveSet(); setSyncUI('', 'Sync'); render(); break;
    case 'syncNow': sync(true); break;
    case 'exportData': {
      const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = 'instructor-hub-backup-' + today() + '.json'; document.body.appendChild(aEl); aEl.click(); setTimeout(() => { URL.revokeObjectURL(aEl.href); aEl.remove(); }, 500); break;
    }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'itemForm') { if (saveItem(readItemForm())) { closeModal(); render(); toast('Saved'); } }
  else if (f.id === 'studentForm') {
    const id = f.dataset.id || uid(); const old = D.students[id] || {};
    put('students', Object.assign({}, old, { id, name: val('sf_name').trim(), program: val('sf_prog'), phone: val('sf_phone').trim(), email: val('sf_email').trim(), notes: val('sf_notes').trim(), archived: val('sf_arch') }));
    if (!f.dataset.id) UI.sid = id; closeModal(); render();
  } else if (f.id === 'testForm') {
    const id = f.dataset.id || uid(); const old = D.tests[id] || { marks: {} };
    const t = Object.assign({}, old, { id, sid: val('tf_sid'), kind: old.kind || val('tf_kind'), date: val('tf_date'), mode: val('tf_mode'), aircraft: val('tf_ac'), examiner: val('tf_exam').trim(), loc: val('tf_loc').trim(), partial: val('tf_partial'), integrated: val('tf_int') && (old.kind || val('tf_kind')) === 'cpl', wx: val('tf_wx').trim() });
    put('tests', t); UI.testId = id; UI.tab = 'tests'; closeModal(); render(); window.scrollTo(0, 0);
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sq') { UI.q = el.value; const pos = el.selectionStart; render(); const n = $('sq'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.dataset.set) { SET[el.dataset.set] = el.value; saveSet(); }
  else if (el.dataset.tk) { const t = curTest(); t.tk = t.tk || {}; t.tk[el.dataset.tk] = el.value.trim(); saveTest(t); const c = tkCalc(t.tk); $('tkRes').innerHTML = tkResHTML(c); $('tkBrief').innerHTML = `<span>Brief time <b>${esc(c.brief)}</b></span>`; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dayPick' && el.value) { UI.day = el.value; render(); }
  else if (el.id === 'showArch') { UI.showArchived = el.checked; render(); }
  else if (el.dataset.ch) { const t = curTest(); const m = t.marks[el.dataset.ch] = t.marks[el.dataset.ch] || {}; m.ch = el.value; saveTest(t); }
  else if (el.dataset.rmk) { const t = curTest(); t.marks = t.marks || {}; const m = t.marks[el.dataset.rmk] = t.marks[el.dataset.rmk] || {}; m.r = el.value.trim(); saveTest(t); }
  else if (el.dataset.tk && ['up', 'down', 'bs', 'be'].includes(el.dataset.tk) && el.value) { const t = curTest(); el.value = fmtHM(el.value); t.tk[el.dataset.tk] = el.value; saveTest(t); }
  else if (el.dataset.tnotes) { const t = curTest(); t.notes = el.value; saveTest(t); }
  else if (el.id === 'importFile' && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !d.students) throw new Error('not a backup'); D = merge(D, d); persist(); queueSync(); render(); toast('Backup merged'); } catch (er) { toast('Could not read that file'); } };
    rd.readAsText(el.files[0]);
  }
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

// theme (same setting as the other tools)
(function () {
  const root = document.documentElement, btn = $('themeBtn');
  let c = null; try { c = localStorage.getItem('pfTheme'); } catch (e) {}
  const eff = () => c || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const apply = () => { if (c) root.setAttribute('data-theme', c); else root.removeAttribute('data-theme'); btn.textContent = eff() === 'dark' ? 'Light' : 'Dark'; };
  btn.addEventListener('click', () => { c = eff() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('pfTheme', c); } catch (e) {} apply(); });
  apply();
})();

render();
if (SET.token) { setSyncUI(SET.lastSync ? 'ok' : '', SET.lastSync ? 'Synced ' + new Date(SET.lastSync).toTimeString().slice(0, 5) : 'Sync'); sync(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
